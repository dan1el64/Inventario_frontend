<h2 mat-dialog-title>{{ data?.id ? 'Editar producto' : 'Agregar producto' }}</h2>
<div mat-dialog-content>
  <form [formGroup]="productForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre del Producto</mat-label>
      <input matInput formControlName="name">
      <mat-error>Escribe el nombre del producto.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Categoría</mat-label>
      <input matInput formControlName="category">
      <mat-error>Escribe una categoría.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Precio</mat-label>
      <input matInput type="number" formControlName="price" min="0.01" step="0.01">
      <mat-error>El precio debe ser mayor que cero.</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Cantidad en Stock</mat-label>
      <input matInput type="number" formControlName="stock" min="0" step="1">
      <mat-error>Usa una cantidad entera, igual o mayor que cero.</mat-error>
    </mat-form-field>
  </form>
  <p *ngIf="error" role="alert">{{ error }}</p>
</div>
<div mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="closeDialog()" [disabled]="saving">Cancelar</button>
  <button mat-raised-button color="primary" (click)="submitForm()" [disabled]="productForm.invalid || saving">
    {{ saving ? 'Guardando…' : (data?.id ? 'Guardar cambios' : 'Agregar') }}
  </button>
</div>
